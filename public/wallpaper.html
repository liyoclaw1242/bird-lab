<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>雨夜樹屋｜一鳥在手</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="favicon-32.png">
  <style>
    html, body { height: 100%; margin: 0; overflow: hidden; cursor: none; background: #081426; }
    canvas { position: fixed; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; }
    body.awake { cursor: default; }
    .wp-controls { position: fixed; right: 16px; bottom: 16px; display: flex; gap: 8px; opacity: 0; pointer-events: none; transition: opacity .3s; }
    body.awake .wp-controls { opacity: 1; pointer-events: auto; }
    .wp-controls button { width: 44px; height: 44px; padding: 0; font-size: 20px; line-height: 1; cursor: pointer; opacity: .55; background: rgba(8, 20, 38, .75); border: 2px solid #5a7f8c; border-radius: 10px; }
    .wp-controls button.on { opacity: 1; border-color: #ffb24a; }
  </style>
</head>
<body>
  <canvas id="scene" aria-label="雨夜森林裡的巨樹，樹幹裡有發光的房間，住著鳥"></canvas>
  <script src="engine.js"></script>
  <script src="data.js"></script>
  <script src="wallpaper.js"></script>
  <script src="wallpaper-sound.js"></script>
</body>
</html>
