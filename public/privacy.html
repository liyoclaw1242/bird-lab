<body><h1>隱私說明</h1>
<p><b>Google 登入是選用的。</b>登入時，我們只保存 Google 提供的帳號編號，用來把你的鳥綁在帳號上。不保存你的姓名、Email 或大頭貼。</p>
<p><b>遊戲資料。</b>我們保存你擁有的鳥、隊伍、每天的抽卡與戰鬥紀錄，以及分享連結的領取紀錄。</p>
<p><b>裝置上的資料。</b>瀏覽器會存一段登入憑證和進行中的戰鬥。伺服器只存憑證的雜湊值。</p>
<p><b>IP 位址。</b>為了限制大量建立帳號，我們暫存 IP 的雜湊值，超過一小時的會清除。服務供應商（Vercel、Supabase、Cloudflare、Google）也可能依各自的條款留下存取紀錄。</p>
<p>我們不賣資料，也沒有廣告追蹤。</p>
